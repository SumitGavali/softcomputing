<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.35)" />
      <stop offset="100%" stop-color="rgba(34, 211, 238, 0.18)" />
    </linearGradient>
  </defs>

  <!-- High-contrast dark badge backing: ensures flawless visibility on both Light and Dark browser tabs -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg-grad)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.55" />

  <!-- Outer Symmetric Rhombus Range Boundary -->
  <polygon
    points="16,4.2 27.8,16 16,27.8 4.2,16"
    fill="url(#core-glow)"
    stroke="url(#brand-grad)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Concentric Battery Range Catchment Ring (Dashed) -->
  <circle
    cx="16"
    cy="16"
    r="7"
    stroke="url(#brand-grad)"
    stroke-width="1.1"
    stroke-dasharray="2 1.8"
    opacity="0.75"
  />

  <!-- 4 Symmetric Cardinal Range Nodes (N, E, S, W) -->
  <circle cx="16" cy="4.2" r="1.6" fill="#34D399" />
  <circle cx="27.8" cy="16" r="1.6" fill="#22D3EE" />
  <circle cx="16" cy="27.8" r="1.6" fill="#34D399" />
  <circle cx="4.2" cy="16" r="1.6" fill="#22D3EE" />

  <!-- Central Geometric Energy Star / Intelligence Spark -->
  <path
    d="M16 10L17.6 14.3L22 16L17.6 17.7L16 22L14.4 17.7L10 16L14.4 14.3Z"
    fill="url(#brand-grad)"
  />

  <!-- Ultra-Precision Center Core -->
  <circle cx="16" cy="16" r="1.2" fill="#FFFFFF" />
</svg>
